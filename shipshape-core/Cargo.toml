[package]
name = "shipshape-core"
version = "0.0.1"
edition = "2024"

[dependencies]
derive_more = { version = "2.1", default-features = false, features = ["display", "error", "from", "std"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokei = { version = "15.0", default-features = false }
utoipa = { version = "6.0", default-features = false, features = ["macros"] }

[dev-dependencies]
mockall = { version = "0.15", default-features = false }
