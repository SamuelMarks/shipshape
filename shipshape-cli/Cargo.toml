[package]
name = "shipshape-cli"
version = "0.0.1"
edition = "2024"

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
derive_more = { version = "2.1", default-features = false, features = ["display", "error", "from", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
shipshape-core = { path = "../shipshape-core" }
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "net", "io-util"] }
