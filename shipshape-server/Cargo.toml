[package]
name = "shipshape-server"
version = "0.0.1"
edition = "2024"

[dependencies]
actix-web = { version = "4.18", default-features = false, features = ["macros"] }
actix-cors = { version = "0.7", default-features = false }
base64 = { version = "0.23", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
derive_more = { version = "2.1", default-features = false, features = ["display", "error", "from", "std"] }
diesel = { version = "2.3", default-features = false, features = ["postgres", "r2d2", "chrono"] }
diesel_migrations = { version = "2.3", default-features = false, features = ["postgres"] }
dotenvy = { version = "0.15", default-features = false }
ring = { version = "0.17", default-features = false, features = ["alloc", "dev_urandom_fallback"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "query", "rustls"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
shipshape-core = { path = "../shipshape-core" }
utoipa = { version = "6.0", default-features = false, features = ["macros"] }
urlencoding = { version = "2.1", default-features = false }
uuid = { version = "1.29", default-features = false, features = ["std", "v4"] }
log = { version = "0.4", default-features = false }
env_logger = { version = "0.11", default-features = false }

[dev-dependencies]
httpmock = { version = "0.9", default-features = false }
